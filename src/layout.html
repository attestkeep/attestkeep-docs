<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — Attestkeep docs</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://docs.attestkeep.com/{{canonical}}">
<link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#071f20">
<meta property="og:type" content="article">

    <span class="brand__tag">docs</span>

  <button class="top__menu" type="button" aria-expanded="false" aria-controls="sidebar">Menu</button>

  <main class="content" id="content">
