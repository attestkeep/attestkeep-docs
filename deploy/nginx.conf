# docs.attestkeep.com — plain files.
#
# TLS terminates at Traefik; this container speaks HTTP on :80. The only real
# work here is extensionless URLs, cache classes, and the security headers a
# security product's own documentation has no excuse for missing.

server {
    listen 80;
    server_name docs.attestkeep.com;
    root /srv/docs;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/xml image/svg+xml;

    # The page fetches nothing from anywhere else, and says so out loud — the
    # same claim the product makes about itself.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location ~* \.(woff2|svg|png|ico)$ { add_header Cache-Control "public, max-age=86400"; }
    location ~* \.(css|js)$           { add_header Cache-Control "public, max-age=3600"; }

    # Documentation is corrected often, so HTML always revalidates: a fix should
    # be readable immediately rather than after a cache expires.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
